<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DRI Course Checker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>DRI course checker</h1>
      <p id="message">Open the Delivery Readiness Portal course page, then start.</p>
      <div class="actions">
        <button id="start">Check courses</button>
        <button id="download" class="secondary" hidden>Download Markdown</button>
      </div>
      <div id="progress" hidden><div id="bar"></div></div>
      <ul id="results"></ul>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
